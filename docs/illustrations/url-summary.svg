      <path d="M-13 12 C -16 19, -9 22, -12 29" fill="none" stroke="#3D4852" stroke-width="3" stroke-linecap="round"/>
      <path d="M-4 14 C -5 21, -1 24, -3 31" fill="none" stroke="#3D4852" stroke-width="3" stroke-linecap="round"/>
      <path d="M4 14 C 5 21, 9 23, 7 30" fill="none" stroke="#3D4852" stroke-width="3" stroke-linecap="round"/>
      <path d="M13 12 C 16 19, 9 21, 12 28" fill="none" stroke="#3D4852" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-8" cy="-5" r="5.5" fill="#FFFFFF" stroke="#3D4852" stroke-width="2"/>
      <circle cx="8" cy="-5" r="5.5" fill="#FFFFFF" stroke="#3D4852" stroke-width="2"/>
      <circle cx="-7" cy="-4" r="2.2" fill="#3D4852"/>
      <circle cx="9" cy="-4" r="2.2" fill="#3D4852"/>
      <circle cx="-6.2" cy="-5" r="0.8" fill="#FFFFFF"/>
      <circle cx="9.8" cy="-5" r="0.8" fill="#FFFFFF"/>
      <path d="M-4 4 Q0 7 4 4" fill="none" stroke="#3D4852" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-15" cy="1" r="2.5" fill="#F4C2C2"/>
      <circle cx="15" cy="1" r="2.5" fill="#F4C2C2"/>
    </g>
  </g>
  <path d="M580 396 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#F0A860" stroke="#3D4852" stroke-width="2"/>
